name: Generic RTL synthesis
on: [push, pull_request, workflow_dispatch]
jobs:
  synthesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install synthesizer
        run: sudo apt-get update -qq && sudo apt-get install -y yosys
      - name: Synthesize flit_crossbar5
        run: yosys -Q -T -p 'read_verilog -sv rtl/flit_crossbar5.sv; hierarchy -check -top flit_crossbar5; synth -top flit_crossbar5; stat'
